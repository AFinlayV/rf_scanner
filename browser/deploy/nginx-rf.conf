# rf.alexthe5th.com — the browser build of RF Scanner, served as static files.
#
# Modelled on /etc/nginx/sites-available/showrunner-public on the same box.
# Read that file too; the reasoning in it about ACME and about listening on
# the public IPv4 only applies here unchanged.
#
# DNS MUST EXIST FIRST:  rf.alexthe5th.com  A  ->  144.202.111.184
# The apex is on Squarespace; this subdomain is not, and had no record at
# all as of 2026-08-01. Certbot proves control of the name by being reached
# over it, so nothing below can succeed until that record resolves.
#
# Install:
#   browser/deploy/deploy.sh                      # creates + fills the webroot
#   sudo cp browser/deploy/nginx-rf.conf /etc/nginx/sites-available/rf-scanner
#   sudo ln -s /etc/nginx/sites-available/rf-scanner /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx   # -t covers showrunner too
#
# Issue with the WEBROOT authenticator, then install the TLS block:
#   sudo certbot certonly --webroot -w /var/www/acme -d rf.alexthe5th.com
#   sudo certbot install --nginx --cert-name rf.alexthe5th.com
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot renew --dry-run     # the step that actually proves it
#
# Two steps, not one, on purpose. `certbot --nginx -d …` would do both but
# would record authenticator=nginx for renewals; this box's existing cert
# has authenticator=webroot with webroot_path=/var/www/acme (verified in
# /etc/letsencrypt/renewal/showrunner.alexthe5th.com.conf), and the ACME
# location below is what keeps that working. `install` only edits nginx.
#
# What `install` does to this file, mirroring showrunner-public: it rewrites
# the `listen` below into `listen 144.202.111.184:443 ssl;`, adds the
# certificate paths, and appends a SEPARATE server block on plain `listen
# 80` that 301s to https. Do not hand-write any of that first.
#
# ── HTTPS IS NOT A NICETY HERE ──────────────────────────────────────────
# Web Serial refuses to run outside a secure context. Served over plain
# HTTP this page loads, renders, and then cannot open the radio at all —
# it fails as a working-looking app with a dead Connect button. localhost
# is the one exception, which is why the bench harness works without any
# of this.
#
# ── THERE IS NO proxy_pass HERE, AND THERE MUST NEVER BE ONE ────────────
# This box has no radio and never will (AGENTS.md: "The VPS can never run
# a scan"). The browser build exists precisely so the scan happens on the
# viewer's machine over their own USB port. A proxy_pass added here would
# not make the VPS able to scan; it would just be a route to something
# that cannot help, and it would quietly turn a stateless static host back
# into the stateful thing this rewrite deleted.

server {
    server_name rf.alexthe5th.com;

    root /var/www/rf-scanner;
    index index.html;

    # ACME renewal. Must come first and must be `^~` — see the long note in
    # showrunner-public about why the dry-run is the only thing that proves
    # this works once certbot has added its port-80 redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    # A stale app.js at a gig means scanning with the wrong band edges or
    # the wrong export maths, and the operator has no way to tell. These
    # files are a few hundred KB total on a link that is idle by then, so
    # revalidation costs nothing worth having.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    autoindex off;
    server_tokens off;

    # Deliberately NO Permissions-Policy header. Web Serial is gated by
    # permissions policy, and `serial=()` — which is what a copied-in
    # "hardening" header block usually contains — disables the radio for
    # the whole origin. The failure looks like a browser bug, not a header.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    access_log /var/log/nginx/rf-scanner.access.log;
    error_log  /var/log/nginx/rf-scanner.error.log;

    # The address here is load-bearing, not decoration. certbot preserves
    # the address part when it rewrites this into the 443 listen, so
    # binding the public IPv4 explicitly is what stops the eventual TLS
    # block from also claiming :443 on the tailnet address — which
    # tailscaled owns. showrunner-public carries the same constraint.
    listen 144.202.111.184:80;
}
